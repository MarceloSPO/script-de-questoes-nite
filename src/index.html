<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de CSV | NITE</title>
    <style>
      :root {
        --azul: #1e3f94;
        --azul-escuro: #182f6e;
        --fundo: #f6f8ff;
        --card: #ffffff;
        --cinza: #6b7280;
        --borda: #e5e7eb;
        --ok: #16a34a;
        --erro: #dc2626;
        --focus: #2563eb;
        --radius: 14px;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji",
          "Segoe UI Emoji";
        background: radial-gradient(
            1200px 600px at 80% -10%,
            rgba(30, 63, 148, 0.15),
            transparent 60%
          )
          var(--fundo);
        color: #0b1324;
      }

      header {
        background: linear-gradient(135deg, var(--azul), var(--azul-escuro));
        color: #fff;
        padding: 26px 20px;
        position: sticky;
        top: 0;
        z-index: 10;
        box-shadow: 0 6px 18px rgba(30, 63, 148, 0.25);
        animation: drop-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      header .wrap {
        max-width: 920px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      header .logo {
        width: auto;
        height: auto;
        padding: 0 10px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.18);
        display: grid;
        place-items: center;
        backdrop-filter: blur(3px);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
        animation: floaty 6s ease-in-out infinite;
      }
      header h1 {
        font-size: 20px;
        margin: 0;
        letter-spacing: 0.3px;
        font-weight: 700;
      }
      header p {
        margin: 0;
        opacity: 0.85;
        font-size: 13px;
      }

      .container {
        max-width: 920px;
        margin: 40px auto;
        padding: 0 16px;
        animation: fade-up 0.6s 0.15s both;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--borda);
        border-radius: var(--radius);
        padding: 26px;
        box-shadow: var(--shadow);
      }

      .title {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 14px;
        font-size: 18px;
        font-weight: 700;
      }
      .subtitle {
        margin: 0 0 22px;
        color: var(--cinza);
        font-size: 14px;
      }

      .drop-wrapper {
        width: 300px;
        height: 100px;
        position: relative;
        margin-bottom: 30px;
        margin: auto;
      }

      .dropzone {
        border: 2px dashed #c7d2fe;
        width: 100px;
        background: #f8fafc;
        border-radius: 12px;
        padding: 26px;
        text-align: center;
        transition: transform 0.2s ease, box-shadow 0.2s ease,
          border-color 0.2s ease, background 0.2s ease;
        cursor: pointer;
        position: absolute;
        width: 300px;
        outline: none;
      }
      .dropzone:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(30, 63, 148, 0.12);
        background: #f1f5ff;
      }
      .dropzone.dragover {
        border-color: var(--azul);
        background: #eef2ff;
        box-shadow: 0 0 0 6px rgba(30, 63, 148, 0.08);
      }
      .dropzone input[type="file"] {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }
      .dropzone .hint {
        font-size: 13px;
        color: var(--cinza);
      }
      .file-info {
        margin-top: 12px;
        font-size: 14px;
        display: none;
      }
      .file-info.ok {
        color: var(--ok);
        display: block;
      }
      .file-info.err {
        color: var(--erro);
        display: block;
      }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 20px;
        flex-wrap: wrap;
        width: 100%;
        justify-content: center;
        align-items: center;
        padding: 20px 0;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        transition: transform 0.12s ease, box-shadow 0.12s ease,
          opacity 0.2s ease;
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--azul), var(--azul-escuro));
        color: #fff;
        box-shadow: 0 8px 18px rgba(30, 63, 148, 0.25);
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 24px rgba(30, 63, 148, 0.3);
      }
      .btn-primary:active {
        transform: translateY(0);
        box-shadow: 0 4px 12px rgba(30, 63, 148, 0.2);
      }
      .btn-secondary {
        background: #eef2ff;
        color: #1f2937;
        border: 1px solid #dbe2ff;
      }
      .btn-secondary:hover {
        transform: translateY(-1px);
      }
      .btn-secondary:active {
        transform: translateY(0);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none !important;
        box-shadow: none !important;
      }

      .progress {
        height: 8px;
        width: 100%;
        background: #eef2ff;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 18px;
        display: none;
      }
      .progress .bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--azul), var(--azul-escuro));
        animation: loading 1.2s linear infinite;
      }

      .dropzone:focus-visible,
      .btn-primary:focus-visible,
      .btn-secondary:focus-visible {
        outline: 3px solid rgba(37, 99, 235, 0.5);
        outline-offset: 2px;
      }

      code {
        background: #f4f6fb;
        color: #1e3f94;
        font-family: "Fira Code", "Consolas", "Courier New", monospace;
        font-size: 0.95em;
        padding: 2px 6px;
        border-radius: 6px;
        border: 1px solid #e0e7ff;
        white-space: nowrap;
      }

      .modifiers {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10%;
      }

      .modifiers .random-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .modifiers .random-wrapper span {
        color: #1e3f94;
        font-size: 12px;
        font-weight: bold;
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 80px;
        height: 34px;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        display: flex;
        align-items: center;
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #d1d5db;
        border-radius: 34px;
        transition: background-color 0.3s;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 8px;
        box-sizing: border-box;
      }

      .slider::before {
        content: "";
        position: absolute;
        height: 26px;
        width: 26px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        border-radius: 50%;
        transition: transform 0.3s;
        z-index: 2;
      }

      .slider .check svg {
        width: 30px;
        height: 30px;
        margin: auto;
      }

      input:checked + .slider {
        background-color: #1e3f94;
      }
      input:checked + .slider::before {
        transform: translateX(44px);
      }

      input:not(:checked) + .slider {
        background-color: #e5e7eb;
      }

      input:not(:checked) + .slider .check > svg {
        opacity: 0;
      }

      .custom-select {
        position: relative;
        width: 200px;
      }

      select {
        width: 100%;
        padding: 10px 15px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        appearance: none;
        background-color: white;
        cursor: pointer;
      }

      select:focus {
        border-color: #3f51b5;
        box-shadow: 0 0 5px rgba(63, 81, 181, 0.5);
      }

      option {
        padding: 10px;
      }

      select option:checked {
        background-color: #3f51b5;
        color: white;
      }

      .custom-select::after {
        content: "▼";
        position: absolute;
        top: 50%;
        right: 15px;
        transform: translateY(-50%);
        pointer-events: none;
        font-size: 12px;
        color: #555;
      }

      .select-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .select-wrapper span {
        color: #1e3f94;
        font-size: 12px;
        font-weight: bold;
      }

      @keyframes drop-in {
        from {
          transform: translateY(-12px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      @keyframes fade-up {
        from {
          transform: translateY(8px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      @keyframes floaty {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-3px);
        }
      }
      @keyframes loading {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>

    <main class="container" role="main">
      <section class="card" aria-labelledby="ttl">
        <h2 id="ttl" class="title">Arquivo de entrada</h2>
        <p class="subtitle">
          Aceitamos apenas arquivos do Microsoft Word no formato
          <strong>.docx</strong>.
        </p>
        <div class="drop-wrapper">
          <label
            class="dropzone"
            id="dropzone"
            tabindex="0"
            aria-label="Selecione ou arraste um arquivo .docx">
            <input
              id="file"
              type="file"
              accept=".docx"
              aria-label="Escolher arquivo .docx" />
            <div>
              <div style="font-weight: 700; margin-bottom: 6px">
                Clique para escolher ou arraste aqui
              </div>
              <div class="hint">Somente .docx</div>
            </div>
          </label>
        </div>

        <div class="modifiers">
          <div class="random-wrapper">
            <span>Randomizar:</span>
            <label
              class="switch"
              title="Adiciona o prefixo nas opções das questões, ex: A), B), C)...">
              <input type="checkbox" />
              <span class="slider">
                <span class="check"
                  ><svg
                    fill="#fff"

    <script>
      (function () {
        const input = document.getElementById("file");
        const info = document.getElementById("fileInfo");
        const btnC = document.getElementById("btnConvert");
        const btnX = document.getElementById("btnCancel");
        const dz = document.getElementById("dropzone");
        const prog = document.getElementById("progress");
        const randomInput = document.querySelector("input[type='checkbox']");
        const selectType = document.querySelector(".custom-select>select");

        const isDocx = (file) => !!file && /\.docx$/i.test(file.name);

        let file;

        function setValid(file) {
          info.className = "file-info ok";
          info.textContent = `Arquivo selecionado: ${file.name}`;
          btnC.disabled = false;
        }
        function setInvalid(msg) {
          info.className = "file-info err";
          info.textContent = msg || "Arquivo inválido. Envie um .docx.";
          btnC.disabled = true;
        }
        function clearAll() {
          input.value = "";
          info.textContent = "";
          info.className = "file-info";
          btnC.disabled = true;
          prog.style.display = "none";
          prog.setAttribute("aria-hidden", "true");
          file = null;
        }

        function renderErrors(errors) {
          const container = document.getElementById("errors-container");
          container.innerHTML = ""; // limpa antes

          errors.forEach((error) => {
            const wrapper = document.createElement("div");
            wrapper.className = "error-item";
            wrapper.style.border = "1px solid #ccc";
            wrapper.style.padding = "8px";
            wrapper.style.marginBottom = "10px";
            wrapper.style.borderRadius = "6px";

            // Header com input + botão copiar + toggle
            const header = document.createElement("div");
            header.style.display = "flex";
            header.style.alignItems = "center";

            const toggleBtn = document.createElement("button");
            toggleBtn.textContent = "▶";
            toggleBtn.style.marginRight = "6px";

            const input = document.createElement("input");
            input.type = "text";
            input.value = `${error.question.id} - ${error.message}`;
            input.readOnly = true;
            input.style.flex = "1";
            input.style.marginRight = "6px";
            input.style.cursor = "pointer";

            // quando clicar no campo → copiar também
            input.onclick = () => {
              navigator.clipboard.writeText(input.value).then(() => {
                input.style.backgroundColor = "#d4edda"; // verde claro
                setTimeout(() => (input.style.backgroundColor = ""), 600);
              });
            };

            header.appendChild(toggleBtn);
            header.appendChild(input);

            const details = document.createElement("div");
            details.hidden = true;
            details.style.marginTop = "8px";
            details.style.fontSize = "14px";
            details.style.whiteSpace = "pre-wrap";
            details.textContent = JSON.stringify(error.question, null, 2);

            toggleBtn.onclick = () => {
              details.hidden = !details.hidden;
              toggleBtn.textContent = details.hidden ? "▶" : "▼";
            };

            wrapper.appendChild(header);
            wrapper.appendChild(details);
            container.appendChild(wrapper);
          });
        }

        input.addEventListener("change", () => {
          const localFile = input.files[0];
          if (!localFile) {
            clearAll();
            return;
          }
          if (!isDocx(localFile)) {
            clearAll();
            setInvalid("Somente arquivos .docx são aceitos.");
            return;
          }
          setValid(localFile);

          file = localFile;
        });

        ["dragenter", "dragover"].forEach((ev) => {
          dz.addEventListener(ev, (e) => {
            e.preventDefault();
            e.stopPropagation();
            dz.classList.add("dragover");
          });
        });
        ["dragleave", "drop"].forEach((ev) => {
          dz.addEventListener(ev, (e) => {
            e.preventDefault();
            e.stopPropagation();
            dz.classList.remove("dragover");
          });
        });
        dz.addEventListener("drop", (e) => {
          const localFile = e.dataTransfer.files[0];
          if (!localFile) {
            return;
          }
          if (!isDocx(localFile)) {
            clearAll();
            setInvalid("Somente arquivos .docx são aceitos.");
            return;
          }

          const dt = new DataTransfer();
          dt.items.add(localFile);
          input.files = dt.files;
          setValid(localFile);

          file = localFile;
        });

        btnC.addEventListener("click", (e) => {
          e.preventDefault();
          const file = input.files[0];
          if (!file || !isDocx(file)) {
            setInvalid("Escolha um arquivo .docx válido antes de converter.");
            return;
          }

          prog.style.display = "block";
          prog.setAttribute("aria-hidden", "false");

          const reader = new FileReader();
          reader.onload = function () {
            const arrayBuffer = reader.result;
            const bytes = new Uint8Array(arrayBuffer);
            let binary = "";
            for (let i = 0; i < bytes.byteLength; i++) {
              binary += String.fromCharCode(bytes[i]);
            }
            const base64String = btoa(binary);

            window.pywebview.api
              .process_form(
                file.name,
                base64String,
                selectType.value,
                randomInput.checked
              )
              .then((response) => {
                if (response.had_error) {
                  renderErrors(response.errors);
                }

                prog.style.display = "none";
                prog.setAttribute("aria-hidden", "true");
                clearAll();
              })
              .catch((err) => {
                console.error("Erro:", err);
              });
          };
          reader.readAsArrayBuffer(file);

          let t = setTimeout(() => {
            prog.style.display = "none";
            prog.setAttribute("aria-hidden", "true");
            clearAll();
            clearTimeout(t);
          }, 1600);
        });

        btnX.addEventListener("click", (e) => {
          e.preventDefault();
          clearAll();
        });

        dz.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            input.click();
          }
        });
      })();
    </script>
  </body>
</html>
